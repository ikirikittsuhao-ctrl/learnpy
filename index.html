<!DOCTYPE html>
<html lang="ja" class="scroll-smooth" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sennin py - STEP 0</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Marked.js (Markdown Parser) -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Font Awesome & Material Symbols -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <style>
        /* === テーマ変数＆ベーススタイル定義 === */
        :root {
            --bg-main: #ffffff;
            --bg-header: rgba(255, 255, 255, 0.95);
            --bg-sidebar: #f8fafc;
            --bg-card: #ffffff;
            --border-color: #e2e8f0;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --text-heading: #0f172a;
            --code-bg: #f1f5f9;
            --accent: #0284c7;
            --accent-bg: rgba(2, 132, 199, 0.08);
            --hover-bg: rgba(0, 0, 0, 0.04);
        }

        /* ダークテーマ */
        html[data-theme="dark"] {
            --bg-main: #0f172a;
            --bg-header: rgba(15, 23, 42, 0.95);
            --bg-sidebar: #1e293b;
            --bg-card: #1e293b;
            --border-color: #334155;
            --text-main: #cbd5e1;
            --text-muted: #94a3b8;
            --text-heading: #f8fafc;
            --code-bg: #334155;
            --accent: #38bdf8;
            --accent-bg: rgba(56, 189, 248, 0.12);
            --hover-bg: rgba(255, 255, 255, 0.06);
        }

        /* グラス(すりガラス)テーマ */
        html[data-theme="glass"] {
            --bg-main: #0f172a;
            --bg-header: rgba(30, 41, 59, 0.65);
            --bg-sidebar: rgba(30, 41, 59, 0.55);
            --bg-card: rgba(30, 41, 59, 0.45);
            --border-color: rgba(255, 255, 255, 0.15);
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --text-heading: #ffffff;
            --code-bg: rgba(15, 23, 42, 0.6);
            --accent: #38bdf8;
            --accent-bg: rgba(56, 189, 248, 0.15);
            --hover-bg: rgba(255, 255, 255, 0.08);
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            transition: background-color 0.3s, color 0.3s;
        }

        html[data-theme="glass"] body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
            background-attachment: fixed;
        }

        header {
            background-color: var(--bg-header) !important;
            border-color: var(--border-color) !important;
            backdrop-filter: blur(12px);
        }

        aside, .search-dropdown, .popover-panel {
            background-color: var(--bg-sidebar) !important;
            border-color: var(--border-color) !important;
            color: var(--text-main) !important;
        }

        html[data-theme="glass"] aside,
        html[data-theme="glass"] .theme-card,
        html[data-theme="glass"] .search-dropdown,
        html[data-theme="glass"] .popover-panel {
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        /* Markdown Typography スタイル */
        .prose h1 { font-size: 1.875rem; font-weight: 800; border-bottom: 2px solid var(--border-color); padding-bottom: 0.5rem; margin-top: 1.5rem; margin-bottom: 1rem; color: var(--text-heading); scroll-margin-top: 5rem; }
        .prose h2 { font-size: 1.35rem; font-weight: 700; border-bottom: 1px solid var(--border-color); padding-bottom: 0.4rem; margin-top: 2rem; margin-bottom: 0.75rem; color: var(--text-heading); scroll-margin-top: 5rem; }
        .prose h3 { font-size: 1.1rem; font-weight: 700; margin-top: 1.5rem; margin-bottom: 0.5rem; color: var(--text-heading); scroll-margin-top: 5rem; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 0.5rem; }
        .prose h4 { font-size: 1rem; font-weight: 700; margin-top: 1.25rem; margin-bottom: 0.5rem; color: var(--text-muted); }
        .prose p { margin-bottom: 1rem; line-height: 1.75; color: var(--text-main); font-size: 0.95rem; }
        .prose blockquote { border-left: 4px solid var(--accent); background-color: var(--accent-bg); padding: 0.75rem 1rem; margin-bottom: 1rem; border-radius: 0 0.5rem 0.5rem 0; font-weight: 500; color: var(--text-heading); }
        .prose pre { background-color: #0f172a; color: #f8fafc; padding: 1rem; border-radius: 0.5rem; overflow-x: auto; margin-bottom: 1rem; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 0.875rem; position: relative; border: 1px solid var(--border-color); }
        .prose ul { list-style-type: disc; padding-left: 1.5rem; margin-bottom: 1rem; color: var(--text-main); }
        .prose ol { list-style-type: decimal; padding-left: 1.5rem; margin-bottom: 1rem; color: var(--text-main); }
        .prose li { margin-bottom: 0.25rem; font-size: 0.95rem; }
        .prose hr { border: 0; border-top: 1px solid var(--border-color); margin: 2rem 0; }
        .prose code:not(pre code) { background-color: var(--code-bg); color: var(--text-heading); padding: 0.15rem 0.4rem; border-radius: 0.25rem; font-size: 0.85em; font-family: ui-monospace, monospace; }

        /* コピーボタン */
        .code-block-wrapper { position: relative; }
        .copy-btn {
            position: absolute;
            top: 0.5rem; right: 0.5rem;
            background-color: #334155; color: #f8fafc;
            border: 1px solid #475569; padding: 0.25rem 0.6rem;
            font-size: 0.75rem; cursor: pointer;
            transition: background-color 0.2s; border-radius: 0.375rem; z-index: 10;
        }
        .copy-btn:hover { background-color: #475569; }

        /* 上に戻るボタン */
        .scroll-top-btn { transition: opacity 0.3s ease, transform 0.3s ease; }
        .scroll-top-btn.hidden-btn { opacity: 0; transform: translateY(1rem); pointer-events: none; }
        .scroll-top-btn.visible-btn { opacity: 1; transform: translateY(0); pointer-events: auto; }

        /* 完了ボタンの調整 (未完了時の視認性向上 & テーマ統一) */
        .custom-check-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            padding: 0.25rem 0.65rem;
            border-radius: 0.375rem;
            border: 1px solid var(--border-color);
            background-color: var(--bg-card);
            color: var(--text-muted);
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            user-select: none;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .custom-check-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            background-color: var(--hover-bg);
        }
        .custom-check-btn.checked {
            background-color: #0284c7;
            border-color: #0284c7;
            color: #ffffff;
            animation: popCheck 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .custom-check-btn .check-icon {
            width: 14px;
            height: 14px;
            stroke-dasharray: 20;
            stroke-dashoffset: 20;
            transition: stroke-dashoffset 0.3s ease;
        }
        .custom-check-btn.checked .check-icon {
            stroke-dashoffset: 0;
        }

        @keyframes popCheck {
            0% { transform: scale(0.9); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }

        /* 検索ハイライト */
        mark.search-highlight {
            background-color: #fde047;
            color: #0f172a;
            border-radius: 2px;
            padding: 0 2px;
        }

        /* 検索ジャンプ時の対象強調アニメーション */
        .search-target-highlight {
            animation: targetHighlight 2s ease-out;
        }
        @keyframes targetHighlight {
            0% { background-color: rgba(56, 189, 248, 0.3); }
            100% { background-color: transparent; }
        }

        /* アコーディオンの矢印アニメーション */
        .accordion-icon {
            transition: transform 0.2s ease;
        }
        .accordion-toggle.collapsed .accordion-icon {
            transform: rotate(-90deg);
        }
    </style>
</head>
<body class="flex flex-col min-h-screen relative">

    <!-- モバイル用検索スライドインバー -->
    <div id="mobile-search-modal" class="fixed top-0 left-0 right-0 z-50 border-b p-3 shadow-md transform -translate-y-full transition-transform duration-300 ease-in-out lg:hidden" style="background-color: var(--bg-sidebar); border-color: var(--border-color);">
        <div class="flex items-center gap-2 max-w-2xl mx-auto relative">
            <span class="material-symbols-outlined text-slate-400 text-lg">search</span>
            <input type="text" id="mobile-wiki-search" placeholder="ドキュメント内を検索..." class="w-full border text-sm px-3 py-1.5 rounded-md focus:outline-none focus:border-sky-500 transition-all" style="background-color: var(--bg-card); border-color: var(--border-color); color: var(--text-main);" />
            <button id="close-mobile-search-btn" class="p-1 flex items-center justify-center text-slate-400 hover:text-slate-200">
                <span class="material-symbols-outlined text-xl">close</span>
            </button>

            <!-- モバイル検索結果ドロップダウン -->
            <div id="mobile-search-results" class="search-dropdown hidden absolute top-full left-0 right-0 mt-2 border rounded-lg shadow-xl max-h-80 overflow-y-auto z-50 p-2"></div>
        </div>
    </div>

    <!-- モバイル用サイドバー背景（薄い灰色オーバーレイ） -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-slate-900/40 z-30 opacity-0 pointer-events-none transition-opacity duration-300 lg:hidden"></div>

    <!-- ヘッダー -->
    <header class="sticky top-0 z-40 h-14 flex items-center px-4 justify-between border-b">
        <div class="flex items-center gap-3">
            <button id="mobile-menu-btn" class="lg:hidden hover:opacity-80 flex items-center" style="color: var(--text-main);">
                <span class="material-symbols-outlined">menu</span>
            </button>
            <a href="#" class="flex items-center gap-2 font-bold text-base tracking-tight" style="color: var(--text-heading);">
                <i class="fa-brands fa-python text-sky-500 text-xl"></i>
                <span>sennin py</span>
            </a>
        </div>
          
        <!-- 検索エリア ＆ 設定ピュッとドロップダウン -->
        <div class="flex items-center gap-3">
            <!-- デスクトップ検索 -->
            <div class="hidden lg:block relative w-80">
                <input type="text" id="wiki-search" placeholder="キーワードで検索..." class="w-full border text-xs px-3 py-1.5 rounded-md focus:outline-none focus:border-sky-500 transition-all" style="background-color: var(--bg-card); border-color: var(--border-color); color: var(--text-main);" />
                <!-- 検索結果表示ドロップダウン -->
                <div id="desktop-search-results" class="search-dropdown hidden absolute top-full left-0 right-0 mt-1 border rounded-lg shadow-xl max-h-96 overflow-y-auto z-50 p-2 text-xs"></div>
            </div>

            <button id="open-mobile-search-btn" class="lg:hidden p-1 flex items-center justify-center text-slate-400 hover:text-slate-200">
                <span class="material-symbols-outlined text-xl">search</span>
            </button>

            <!-- 設定トリガーボタン (ポップオーバー表示) -->
            <div class="relative">
                <button id="theme-toggle-popover-btn" class="p-1.5 rounded-lg border hover:bg-slate-500/10 transition-colors flex items-center gap-1 text-xs font-semibold" style="border-color: var(--border-color); color: var(--text-main);">
                    <span class="material-symbols-outlined text-base text-sky-500">palette</span>
                    <span class="hidden sm:inline">表示設定</span>
                </button>

                <!-- ピュッと表示される独自設定パネル -->
                <div id="popover-panel" class="popover-panel hidden absolute right-0 top-full mt-2 w-56 border rounded-xl shadow-2xl p-3 z-50 transition-all duration-200 transform origin-top-right">
                    <div class="text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-2">テーマ切り替え</div>
                    <div class="space-y-1 mb-3">
                        <button data-theme-val="light" class="theme-select-btn w-full flex items-center gap-2 px-2.5 py-1.5 rounded-md hover:bg-slate-500/10 text-xs text-left transition-colors font-medium">
                            <span class="material-symbols-outlined text-sm text-amber-500">light_mode</span>
                            <span>ライトテーマ</span>
                        </button>
                        <button data-theme-val="dark" class="theme-select-btn w-full flex items-center gap-2 px-2.5 py-1.5 rounded-md hover:bg-slate-500/10 text-xs text-left transition-colors font-medium">
                            <span class="material-symbols-outlined text-sm text-indigo-400">dark_mode</span>
                            <span>ダークテーマ</span>
                        </button>
                        <button data-theme-val="glass" class="theme-select-btn w-full flex items-center gap-2 px-2.5 py-1.5 rounded-md hover:bg-slate-500/10 text-xs text-left transition-colors font-medium">
                            <span class="material-symbols-outlined text-sm text-sky-400">auto_awesome</span>
                            <span>グラス（すりガラス）</span>
                        </button>
                    </div>

                    <div class="pt-2 border-t" style="border-color: var(--border-color);">
                        <button id="reset-progress-btn" class="w-full flex items-center justify-between px-2.5 py-1.5 rounded-md text-rose-500 hover:bg-rose-500/10 text-xs transition-colors font-medium">
                            <span>学習進捗リセット</span>
                            <span class="material-symbols-outlined text-sm">restart_alt</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <div class="flex-1 max-w-[1440px] w-full mx-auto flex">

        <!-- 左サイドバー -->
        <aside id="sidebar" class="fixed lg:sticky top-14 left-0 z-40 w-64 h-[calc(100vh-3.5rem)] border-r overflow-y-auto p-4 transition-transform duration-300 -translate-x-full lg:translate-x-0 flex flex-col justify-between flex-shrink-0">
            <div>
                <!-- 学習進捗ゲージ表示 (テーマ変数化) -->
                <div class="mb-4 p-3 rounded-lg border theme-card" style="background-color: var(--bg-card); border-color: var(--border-color);">
                    <div class="flex justify-between items-center text-xs font-bold mb-1.5">
                        <span style="color: var(--text-heading);">学習進捗状況</span>
                        <span id="progress-percent" class="text-sky-500">0%</span>
                    </div>
                    <div class="w-full border h-2 rounded-full overflow-hidden" style="background-color: var(--code-bg); border-color: var(--border-color);">
                        <div id="progress-bar" class="bg-sky-500 h-full w-0 transition-all duration-300"></div>
                    </div>
                </div>

                <div class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">コース目次</div>
                <nav id="course-nav" class="space-y-1 text-sm font-medium">
                    <!-- JSで動的に構築されます -->
                </nav>
            </div>
        </aside>

        <!-- 中央: メインドキュメント表示領域 -->
        <main class="flex-1 max-w-4xl px-6 py-8 mx-auto w-full min-w-0">
            <div id="markdown-content" class="prose max-w-none">
                <!-- JSで動的にレンダリングされます -->
            </div>
        </main>

        <!-- 右サイドバー: ページ内目次 (TOC) -->
        <aside class="hidden xl:block w-56 h-[calc(100vh-3.5rem)] sticky top-14 p-4 text-xs overflow-y-auto flex-shrink-0 border-l" style="border-color: var(--border-color);">
            <div class="font-bold opacity-70 mb-2 flex items-center gap-1">
                <span class="material-symbols-outlined text-sm">format_list_bulleted</span> このページの内容
            </div>
            <ul id="toc" class="space-y-1.5 opacity-80 border-l pl-3" style="border-color: var(--border-color);">
                <!-- JSで自動生成 -->
            </ul>
        </aside>

    </div>

    <!-- 上に戻るボタン -->
    <button id="scroll-to-top" aria-label="上に戻る" class="scroll-top-btn hidden-btn fixed bottom-6 right-6 z-30 bg-sky-600 hover:bg-sky-700 active:bg-sky-800 text-white w-10 h-10 rounded-full shadow-lg flex items-center justify-center transition-all duration-300 focus:outline-none">
        <span class="material-symbols-outlined text-xl">arrow_upward</span>
    </button>

    <!-- JavaScript描画・操作処理 -->
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const contentContainer = document.getElementById('markdown-content');
            const navContainer = document.getElementById('course-nav');

            // 1. JSON & Markdown の非同期取得
            try {
                const koumokuRes = await fetch('data/koumoku.json');
                const koumokuData = await koumokuRes.json();

                // サイドバー目次の動的レンダリング
                renderNav(koumokuData);

                // アクティブなSTEP（STEP 0）のMarkdownを取得
                const activeStep = koumokuData.find(step => step.mdPath);
                if (activeStep) {
                    const mdRes = await fetch(activeStep.mdPath);
                    const markdownSource = await mdRes.text();
                    contentContainer.innerHTML = marked.parse(markdownSource);
                }
            } catch (err) {
                console.error('データの取得に失敗しました:', err);
                contentContainer.innerHTML = '<p class="text-rose-500">コンテンツの読み込みエラーが発生しました。</p>';
                return;
            }

            // サイドバー生成用関数
            function renderNav(data) {
                navContainer.innerHTML = '';
                data.forEach(step => {
                    if (step.items && step.items.length > 0) {
                        const stepWrapper = document.createElement('div');
                        stepWrapper.className = 'space-y-1';

                        const toggleBtn = document.createElement('button');
                        toggleBtn.id = `${step.stepId}-toggle`;
                        toggleBtn.className = "accordion-toggle w-full px-2.5 py-1.5 text-xs font-bold text-sky-500 rounded-md flex items-center justify-between transition-colors border";
                        toggleBtn.style.backgroundColor = "var(--accent-bg)";
                        toggleBtn.style.borderColor = "var(--border-color)";
                        toggleBtn.innerHTML = `
                            <span>${step.title}</span>
                            <i class="fa-solid fa-chevron-down text-[10px] accordion-icon"></i>
                        `;

                        const contentDiv = document.createElement('div');
                        contentDiv.id = `${step.stepId}-content`;
                        contentDiv.className = "pl-2 space-y-1 border-l ml-2 mt-1 transition-all overflow-hidden";
                        contentDiv.style.borderColor = "var(--border-color)";

                        step.items.forEach(item => {
                            const link = document.createElement('a');
                            link.href = `#${item.id}`;
                            link.className = "block px-2.5 py-1.5 rounded-md hover:bg-slate-500/10 text-xs sidebar-link";
                            link.textContent = item.title;
                            contentDiv.appendChild(link);
                        });

                        toggleBtn.addEventListener('click', () => {
                            toggleBtn.classList.toggle('collapsed');
                            contentDiv.style.display = contentDiv.style.display === 'none' ? 'block' : 'none';
                        });

                        stepWrapper.appendChild(toggleBtn);
                        stepWrapper.appendChild(contentDiv);
                        navContainer.appendChild(stepWrapper);
                    } else {
                        const prepDiv = document.createElement('div');
                        prepDiv.className = "pt-3";
                        prepDiv.innerHTML = `<div class="px-2.5 py-1.5 text-xs font-bold text-slate-400">${step.title}</div>`;
                        navContainer.appendChild(prepDiv);
                    }
                });
            }

            // 2. コードブロックにコピペボタン追加
            const preBlocks = contentContainer.querySelectorAll('pre');
            preBlocks.forEach((pre) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'code-block-wrapper';
                pre.parentNode.insertBefore(wrapper, pre);
                wrapper.appendChild(pre);

                const copyBtn = document.createElement('button');
                copyBtn.className = 'copy-btn';
                copyBtn.innerText = 'コピー';

                copyBtn.addEventListener('click', () => {
                    const codeText = pre.querySelector('code')?.innerText || pre.innerText;
                    navigator.clipboard.writeText(codeText).then(() => {
                        copyBtn.innerText = 'コピー完了!';
                        setTimeout(() => { copyBtn.innerText = 'コピー'; }, 2000);
                    });
                });

                wrapper.appendChild(copyBtn);
            });

            // 3. TOC & 独自アニメーション付き完了ボタンの挿入
            const headings = contentContainer.querySelectorAll('h2, h3');
            const tocList = document.getElementById('toc');
            let sectionCount = 0;

            headings.forEach((heading) => {
                const titleText = heading.textContent.trim();
                let cleanId = titleText
                    .replace(/^\d+\s*/, '')
                    .replace(/[^\w\u3040-\u30ff\u3400-\u4dbf\u4e00-\u9fff-]/g, '')
                    .toLowerCase();

                if (titleText.includes("01 プログラミングって何")) cleanId = "01-プログラミングって何";
                if (titleText.includes("02 コンピューターとプログラム")) cleanId = "02-コンピューターとプログラム";
                if (titleText.includes("03 Pythonって何")) cleanId = "03-pythonって何";
                if (titleText.includes("04 Pythonを使う準備")) cleanId = "04-pythonを使う準備";

                heading.id = cleanId;

                // 目次追加
                const li = document.createElement('li');
                const a = document.createElement('a');
                a.href = `#${cleanId}`;
                a.textContent = titleText;
                a.className = "hover:text-sky-500 block truncate transition-colors py-0.5 rounded";
                if (heading.tagName === 'H3') li.className = "pl-2";
                li.appendChild(a);
                tocList.appendChild(li);

                // H3 (各セクション) に完了ボタンを差し込む (独自UI)
                if (heading.tagName === 'H3') {
                    sectionCount++;
                      
                    const checkBtn = document.createElement('button');
                    checkBtn.type = "button";
                    checkBtn.className = "custom-check-btn";
                    checkBtn.dataset.sectionId = cleanId;
                    checkBtn.innerHTML = `
                        <svg class="check-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="20 6 9 17 4 12"></polyline>
                        </svg>
                        <span class="btn-text">未完了</span>
                    `;

                    heading.appendChild(checkBtn);
                }
            });

            // 4. 進捗管理 (localStorage)
            const progressKey = 'sennin_py_progress';
            let savedProgress = JSON.parse(localStorage.getItem(progressKey) || '{}');

            function updateProgressUI() {
                const checkBtns = document.querySelectorAll('.custom-check-btn');
                let checkedCount = 0;

                checkBtns.forEach(btn => {
                    const id = btn.dataset.sectionId;
                    const textEl = btn.querySelector('.btn-text');

                    if (savedProgress[id]) {
                        btn.classList.add('checked');
                        textEl.innerText = "完了";
                        checkedCount++;
                    } else {
                        btn.classList.remove('checked');
                        textEl.innerText = "未完了";
                    }
                });

                const percent = sectionCount > 0 ? Math.round((checkedCount / sectionCount) * 100) : 0;
                document.getElementById('progress-percent').innerText = `${percent}%`;
                document.getElementById('progress-bar').style.width = `${percent}%`;
            }

            document.addEventListener('click', (e) => {
                const btn = e.target.closest('.custom-check-btn');
                if (btn) {
                    const id = btn.dataset.sectionId;
                    savedProgress[id] = !savedProgress[id];
                    localStorage.setItem(progressKey, JSON.stringify(savedProgress));
                    updateProgressUI();
                }
            });

            updateProgressUI();

            // 5. テーマ切替機能
            const themeKey = 'sennin_py_theme';
            const htmlEl = document.documentElement;

            function setTheme(theme) {
                htmlEl.setAttribute('data-theme', theme);
                localStorage.setItem(themeKey, theme);
                  
                document.querySelectorAll('.theme-select-btn').forEach(btn => {
                    if (btn.dataset.themeVal === theme) {
                        btn.classList.add('bg-sky-500/10', 'text-sky-500', 'font-bold');
                    } else {
                        btn.classList.remove('bg-sky-500/10', 'text-sky-500', 'font-bold');
                    }
                });
            }

            const currentTheme = localStorage.getItem(themeKey) || 'light';
            setTheme(currentTheme);

            document.querySelectorAll('.theme-select-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    setTheme(btn.dataset.themeVal);
                    closePopover();
                });
            });

            // 6. 設定ポップオーバー表示制御
            const popoverBtn = document.getElementById('theme-toggle-popover-btn');
            const popoverPanel = document.getElementById('popover-panel');
            const resetProgressBtn = document.getElementById('reset-progress-btn');

            function togglePopover() {
                popoverPanel.classList.toggle('hidden');
            }

            function closePopover() {
                popoverPanel.classList.add('hidden');
            }

            popoverBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                togglePopover();
            });

            document.addEventListener('click', (e) => {
                if (!popoverPanel.contains(e.target) && !popoverBtn.contains(e.target)) {
                    closePopover();
                }
            });

            resetProgressBtn.addEventListener('click', () => {
                savedProgress = {};
                localStorage.removeItem(progressKey);
                updateProgressUI();
                closePopover();
            });

            // 7. ドキュメント内リアルタイム検索機能
            function setupSearch(inputId, resultsId) {
                const input = document.getElementById(inputId);
                const resultsContainer = document.getElementById(resultsId);

                input.addEventListener('input', () => {
                    const query = input.value.trim().toLowerCase();
                    if (!query) {
                        resultsContainer.innerHTML = '';
                        resultsContainer.classList.add('hidden');
                        return;
                    }

                    const elements = contentContainer.querySelectorAll('h1, h2, h3, h4, p, li, blockquote');
                    const matches = [];

                    elements.forEach(el => {
                        const text = el.innerText;
                        if (text.toLowerCase().includes(query)) {
                            let heading = el;
                            while (heading && !['H1', 'H2', 'H3'].includes(heading.tagName)) {
                                heading = heading.previousElementSibling || heading.parentElement;
                            }
                              
                            matches.push({
                                text: text.length > 80 ? text.substring(0, 80) + '...' : text,
                                targetEl: el,
                                sectionTitle: heading ? heading.innerText.replace(/(完了|未完了)/g, '').trim() : '全般'
                            });
                        }
                    });

                    if (matches.length === 0) {
                        resultsContainer.innerHTML = `<div class="p-3 text-slate-400 text-center">一致する結果が見つかりません</div>`;
                    } else {
                        resultsContainer.innerHTML = matches.slice(0, 8).map(m => `
                            <div class="search-item p-2 hover:bg-slate-500/10 rounded cursor-pointer border-b last:border-none" style="border-color: var(--border-color);">
                                <div class="font-bold text-sky-500 mb-0.5 text-[10px] opacity-90">${m.sectionTitle}</div>
                                <div class="font-medium text-xs">${highlightText(m.text, query)}</div>
                            </div>
                        `).join('');

                        const items = resultsContainer.querySelectorAll('.search-item');
                        items.forEach((item, index) => {
                            item.addEventListener('click', () => {
                                const target = matches[index].targetEl;
                                  
                                target.scrollIntoView({ behavior: 'smooth', block: 'center' });
                                  
                                target.classList.remove('search-target-highlight');
                                void target.offsetWidth;
                                target.classList.add('search-target-highlight');

                                resultsContainer.classList.add('hidden');
                                input.value = '';
                                  
                                const mobileModal = document.getElementById('mobile-search-modal');
                                if (mobileModal) mobileModal.classList.add('-translate-y-full');
                            });
                        });
                    }

                    resultsContainer.classList.remove('hidden');
                });

                document.addEventListener('click', (e) => {
                    if (!input.contains(e.target) && !resultsContainer.contains(e.target)) {
                        resultsContainer.classList.add('hidden');
                    }
                });
            }

            function highlightText(text, query) {
                const regex = new RegExp(`(${query})`, 'gi');
                return text.replace(regex, '<mark class="search-highlight">$1</mark>');
            }

            setupSearch('wiki-search', 'desktop-search-results');
            setupSearch('mobile-wiki-search', 'mobile-search-results');

            // 8. モバイルサイドバー & スライドイン検索制御
            const mobileBtn = document.getElementById('mobile-menu-btn');
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');

            function openSidebar() {
                sidebar.classList.remove('-translate-x-full');
                overlay.classList.remove('opacity-0', 'pointer-events-none');
                overlay.classList.add('opacity-100', 'pointer-events-auto');
            }

            function closeSidebar() {
                sidebar.classList.add('-translate-x-full');
                overlay.classList.remove('opacity-100', 'pointer-events-auto');
                overlay.classList.add('opacity-0', 'pointer-events-none');
            }

            mobileBtn.addEventListener('click', () => {
                if (sidebar.classList.contains('-translate-x-full')) {
                    openSidebar();
                } else {
                    closeSidebar();
                }
            });

            overlay.addEventListener('click', closeSidebar);
            document.addEventListener('click', (e) => {
                if (e.target.classList.contains('sidebar-link')) {
                    closeSidebar();
                }
            });

            const openSearchBtn = document.getElementById('open-mobile-search-btn');
            const closeSearchBtn = document.getElementById('close-mobile-search-btn');
            const mobileSearchModal = document.getElementById('mobile-search-modal');
            const mobileSearchInput = document.getElementById('mobile-wiki-search');

            openSearchBtn.addEventListener('click', () => {
                mobileSearchModal.classList.remove('-translate-y-full');
                setTimeout(() => mobileSearchInput.focus(), 300);
            });

            closeSearchBtn.addEventListener('click', () => {
                mobileSearchModal.classList.add('-translate-y-full');
            });

            // 9. 上に戻るボタン制御
            const scrollTopBtn = document.getElementById('scroll-to-top');

            window.addEventListener('scroll', () => {
                if (window.scrollY > 300) {
                    scrollTopBtn.classList.remove('hidden-btn');
                    scrollTopBtn.classList.add('visible-btn');
                } else {
                    scrollTopBtn.classList.remove('visible-btn');
                    scrollTopBtn.classList.add('hidden-btn');
                }
            });

            scrollTopBtn.addEventListener('click', () => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
        });
    </script>
</body>
</html>
